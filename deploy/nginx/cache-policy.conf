# Cache policy for the built frontend in /var/www/dimahasao.
#
# Paste these two location blocks into the server { } block of
# /etc/nginx/sites-available/dimahasao.conf, above the SPA fallback.
#
# Why this exists: nginx currently sends no Cache-Control at all, so browsers
# fall back to heuristic freshness and may keep serving a cached index.html
# after a deploy. index.html is the file that names the hashed bundles, so a
# stale copy pins the visitor to the previous release — a fix ships, the site
# does not change, and it looks like the fix failed.
#
# The filenames under /assets/ carry a content hash, so a changed file is a
# changed URL. Those can be cached forever. index.html cannot be cached at all.

location = /index.html {
    add_header Cache-Control "no-cache" always;
}

location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}
